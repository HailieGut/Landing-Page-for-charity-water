<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charity: Water - Give in Seconds</title>

  <!-- Link to CSS file -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header Section -->
  <header class="header">
    <div class="logo">
      <img src="https://d11sa1anfvm2xk.cloudfront.net/media/downloads/logos/cw_horizontal_white.jpg" alt="charity: water logo">
    </div>
  </header>

  <!-- Main Hero Section -->
  <main class="hero">
    <div class="text-section">
      <h1>Give in Seconds.<br>See the Change Forever.</h1>
      <p>

        See the real-world change your contribution makes—from the first drop to the final well.
      </p>
      
      <div class="subscribe-box">
        <button class="ripple-btn">💧 Follow the Ripple</button>
        <button class="subscribe-btn">Subscribe</button>
      </div>

      <p class="subtext">
        Join thousands tracking real stories of water, impact, and change.
      </p>
    </div>

        <div class="image-section">
    <img src="images/Kid.jpg" alt="Child collecting clean water at a pump in Tanzania" loading="lazy">

  </main>
